openapi: 3.1.0
info:
  title: Bob → Naomy, API v1
  version: "1.6.0"
  summary: Contrat entre Bob (agent commercial) et Naomy (agent marketing).
  description: |
    Fichier compagnon du document « Passerelle Bob ↔ Naomy — cahier des charges » (version 1.3.1, 27/10/2026),
    complété par la 1.3.2 (06/11/2026), la 1.3.3 (08/11/2026), la 1.4 (10/11/2026), la 1.5 (10/11/2026) et la 1.6 (10/11/2026).

    Nouveautés 1.6 (10/11, décision de Thérèse : point 8 validé) — prospection commune. AJOUTS SEULEMENT :
    - Une liste d'opposition commune, tenue par Bob : un « stop », une désinscription, une adresse invalide ou une
      plainte chez l'un vaut chez l'autre (et pour les futurs agents).
    - Un dédoublonnage avant chaque campagne : une même boutique ne reçoit pas deux prospections, un client de Bob
      n'est jamais prospecté.
    - Rien ne passe en clair : seulement des empreintes SHA-256 (voir `x-prospection`).
    - `POST /prospection/oppositions`, `GET /prospection/oppositions`, `POST /prospection/verifier`, signés par le
      secret de plateforme. 120 appels par minute au plus, 1 000 empreintes par appel.
    - Webhook `prospectionVerifier` (facultatif, côté Naomy) : la même vérification dans l'autre sens, que Bob
      appellera avant d'importer ses propres listes quand Naomy l'aura ouvert.

    Nouveautés 1.5 (10/11, décisions de Thérèse) — interrupteur entre les consoles Super Admin. AJOUTS SEULEMENT :
    - L'équipe AgenC'AI se gère UNE SEULE FOIS, chez Bob (page « Équipe AgenC'AI » : inviter, rôles, désactiver).
      Naomy n'a pas de liste de membres à elle : elle garde une copie de celle de Bob.
    - Mêmes rôles partout (plusieurs par personne, droits additionnés) : OWNER Propriétaire, SALES Commercial,
      MARKETING Marketing, TECH Technique, BILLING Facturation, SUPPORT Support, READONLY Lecture seule. Chaque console
      les applique à ses propres rubriques (voir `x-console.roles`) et les vérifie côté serveur, pas seulement à l'écran.
    - Un clic suffit pour passer d'une console à l'autre : jeton de passage signé, 60 secondes, usage unique, dans les
      deux sens (voir `x-console.jeton`). Sessions de console limitées à 8 heures.
    - `GET /console/membres` (signature de plateforme) : toute l'équipe telle que Bob la connaît.
    - Webhook `consoleMembre` (`POST https://agenc-ai.com/naomy/api/bob/console/membres`) : chaque changement d'un
      membre (a rejoint, rôles, désactivé, réactivé), signé par le secret de plateforme, avec renvois. Désactivé ou
      rôle retiré : Naomy coupe ses sessions ouvertes tout de suite.
    - Apparence : même structure de console, couleurs de chaque agent (voir `x-console.charte`).

    Nouveautés 1.4 (10/11, décisions de Thérèse) — « Mon équipe » dès l'inscription chez Naomy. AJOUTS SEULEMENT :
    - `POST /comptes` (signé par le secret de plateforme) : le commerçant qui choisit « Naomy + Bob » à son
      inscription chez Naomy obtient un compte Bob déjà relié (portée complète, assistant allumé), sans code ni
      seconde inscription. Essai équipe de 7 jours (formule Indépendant, `payee_jusqu_au` = J+7 à l'heure du pays),
      puis les rappels et la pause habituels de Bob. Le numéro WhatsApp, prouvé par Naomy, remplace le code e-mail ;
      l'e-mail est obligatoire et sera vérifié plus tard. Pas de mot de passe : un lien de connexion à usage unique.
    - Numéro (ou e-mail) déjà connu de Bob : jamais de second compte. 409 `boutique_existante` ; Bob envoie au
      commerçant existant la demande habituelle « Naomy demande à relier votre boutique » (Accepter / Refuser).
    - Mode pré-inscription allumé chez Bob : même règle que pour tous, le compte est pré-inscrit (`pre_inscrit`).
    - `POST /lien-connexion` (clé de la boutique) : un nouveau lien « Connecter mon WhatsApp à Bob » (usage unique,
      24 h). La connexion du numéro au service de Bob passe par la fenêtre Facebook de Meta, dans un navigateur :
      Naomy l'envoie en bouton-lien (« Connecter WhatsApp »).
    - `Boutique` : `whatsapp_connecte`, `pre_inscrit`, `payee_jusqu_au`, `origine`. Tant que `whatsapp_connecte` est
      false, Naomy publie SANS lien de Bob (le numéro du commerçant ne répond pas encore avec Bob).
    - Limites de Meta à connaître : un numéro tout juste inscrit sur WhatsApp Business doit servir environ 7 jours
      avant de pouvoir être connecté ; Meta limite les nouveaux commerçants connectés (10 par 7 jours tant que
      l'entreprise n'est pas vérifiée chez Meta).

    Nouveautés 1.3.3 (08/11, demande de Thérèse relayée par la session Naomy) — AJOUT SEULEMENT, sur
    `webhooks.assistantEnvoi` (`POST /naomy/api/bob/assistant/envoyer`) ; aucun champ existant ne change de sens :
    - `image_png` (facultatif) : carte en image (PNG en base64, 5 Mo au plus avant encodage, 1080 px de large
      conseillés, 1920 de haut au plus). Pour les cartes qui portent des chiffres ou des prénoms de clients (ventes,
      ventes à confirmer, stock, commandes, qui attend) : jamais d'adresse publique pour ces données, donc jamais
      `image_url` pour elles. Naomy dépose l'image chez WhatsApp et l'envoie en tête du message, `texte` en corps
      (ou en légende sans boutons), `boutons` dessous. Dépôt ou envoi refusé → `texte` seul avec les boutons.
    - `liste` (facultatif) : un menu en liste WhatsApp (bouton 20 car., 10 lignes au plus, titre 24, description 72,
      identifiants `bob:` de 200 car. au plus, uniques). Envoi refusé → `texte` avec les choix numérotés ; une réponse
      « 2 » du commerçant dans les 30 minutes revient à Bob comme `bouton_id` de la ligne 2.
    - Exclusions : `image_png` jamais avec `image_url` ni `liste` ; `liste` jamais avec `boutons`, `image_url` ni
      `image_png` (sinon 400).
    - Hors de la fenêtre de 24 h : avec un `modele`, Naomy envoie le modèle et ignore `image_png` et `liste` ; sans
      modèle, 409 `fenetre_fermee` comme avant. Bob n'envoie cartes et menu qu'en réponse au commerçant.
    - Réponse 200 : champ `repli` (booléen) = la version texte est partie à la place de l'image ou de la liste.
    - `texte` reste toujours une version complète, lisible sans l'image (c'est le repli).
    - Les numéros de clients n'apparaissent jamais en entier sur une carte : prénom et numéro masqué.
    - Ordre de mise en service : Naomy accepte d'abord ces champs (son lot 6e en production), puis Bob commence à les
      envoyer, derrière un interrupteur éteint par défaut, essayé d'abord sur une boutique.
    - Taille de requête : jusqu'à environ 7 Mo avec `image_png` ; le serveur web devant `/naomy/api/` doit accepter
      au moins 8 Mo.
    - Inchangés : signature et idempotence par `id_message_bob`, plafond de 30 messages par jour et par boutique,
      « Bob · » ajouté par Naomy, aucun contenu dans les journaux, `additionalProperties: false`.

    Nouveautés 1.3.2 (06/11, secteur Restaurant) — AUCUN changement technique : mêmes routes, mêmes champs, mêmes
    signatures. Le contrat ne fait qu'ajouter une valeur et préciser des valeurs déjà envoyées par Bob :
    - `Secteur` : nouvelle valeur `RESTAURANT` (Bob l'envoie depuis son lot 106). Naomy : RESTAURANT = restaurant
      (maquis, fast-food, traiteur). Une valeur inconnue reste à accepter.
    - `Produit.categorie_bob` d'un restaurant : `ENTREE`, `PLAT`, `GRILLADE`, `DESSERT`, `BOISSON`, `MENU`.
    - `Produit.fiche` d'un plat : `composition`, `sides` (accompagnements au choix, ex. « attiéké, alloco ou riz »),
      `allergens` (seulement parmi les 14 allergènes majeurs, ou « Aucun des 14 »), `extras`, `spicy`, `vegetarian`,
      `prep_time`, `portion`, `volume` (boisson), `menu_content` (formule), `unavailable_on` (date du jour où le plat
      est indisponible). Règle : ne jamais écrire qu'un plat est « sans allergène » si `allergens` est vide.
    - `stock` d'un plat : 1 = disponible aujourd'hui, 0 = indisponible aujourd'hui. Ce n'est pas une quantité : ne
      jamais publier « plus qu'un seul » ni « stock limité » pour un restaurant.
    - Événements d'un plat : `produit.rupture` = « indisponible aujourd'hui » (le restaurant l'a retiré pour la
      journée) ; `produit.reapprovisionne` = le plat revient à la carte (remise automatique au changement de jour, `stock: 1`).
      Ni l'un ni l'autre n'appelle une publication « de retour en stock ».
    - Liens (`POST /liens`) : inchangés. Le client qui touche le lien arrive sur WhatsApp, et Bob lui propose ses
      boutons de restaurant (Commander, Réserver une table, Voir la carte).

    Nouveautés 1.3.1 (relecture de la session Naomy, 27/10) :
    - `POST /appairage/demande` : Naomy signale qu'un de ses commerçants veut relier Bob. Réponse toujours 202.
      La confirmation se fait dans Bob (carte du tableau de bord + e-mail), jamais par WhatsApp : avant l'appairage,
      aucun canal sûr ne relie Bob au commerçant. S'il accepte, Bob lui donne le lien WhatsApp « Relier Bob CODE ».
    - Portée : décidée par Bob (choix du commerçant à la création du code). Naomy ne l'envoie pas ; si elle l'envoie,
      Bob l'ignore. Bob la renvoie toujours dans `ReponseAppairage.portee`.
    - Aiguilleur : le nom en tête de message (« Naomy, … » / « Bob, … ») l'emporte sur la conversation en cours,
      y compris quand Bob attend une réponse (`attend_reponse`). Un salut seul sans conversation en cours reçoit le
      menu de Naomy, avec un bouton « Bob (vos ventes) » en plus. Les commandes connues de Bob (liste
      `x-commandes-bob`) vont à Bob sans question ; celles de Naomy vont à Naomy sans question.
    - Taille : le serveur web de Bob accepte 25 Mo sur `POST /assistant/messages` (note vocale de 16 Mo en base64).

    Nouveautés 1.3 (numéro unique AgenC'AI, décisions du 27/10, rédigées avec la session Naomy) :
    - `POST /assistant/messages` : Naomy transmet à Bob les messages du commerçant qui sont pour Bob (aiguilleur).
    - `webhooks.assistantEnvoi` : Bob demande à Naomy d'envoyer un message au commerçant sur le numéro AgenC'AI.
    - Appairage : champ `portee` (`complete` ou `assistant`). La portée `assistant` (ni posts, ni formule Naomy) est
      ouverte à toutes les formules de Bob, Gratuite comprise.
    - Bob n'envoie sur WhatsApp que des alertes (vente à confirmer, client qui attend) et ses réponses au commerçant ;
      le bilan du soir part par e-mail.

    Nouveautés 1.2 (décisions de Thérèse du 26/10) :
    - `POST /rappels` : Bob prévient le commerçant par e-mail que Naomy a des propositions en attente (lot 5b-2 de
      Naomy). Naomy envoie des faits, jamais de texte : Bob compose l'e-mail lui-même.
    - Naomy est incluse à partir de la formule Indépendant : l'appairage d'une boutique en formule FREE est refusé
      (403 `formule_insuffisante`) ; une boutique reliée qui repasse en FREE garde la liaison, Naomy suspend ses posts.
    - Événement `boutique.formule_changee`.
    - Un commerçant relié depuis Bob entre dans Naomy d'office (hors liste bêta), pour son plan initial (publication).

    Principes :
    - Bob est la source de vérité du catalogue, du stock, des prix et des ventes. Naomy lit, elle ne recopie pas.
    - Naomy n'écrit jamais dans Bob, sauf pour créer ou désactiver ses propres liens suivis.
    - Aucune donnée personnelle des clients de Bob n'est exposée : seulement des produits et des chiffres agrégés.
    - Le contrat ne fait qu'ajouter : un champ nouveau peut apparaître, jamais un champ retiré ou renommé sans passer
      à `v2`. Naomy ignore les champs qu'elle ne connaît pas.

    Conventions :
    - Dates en ISO 8601, heure universelle (`2026-10-25T14:03:00Z`).
    - Montants : chaîne décimale + devise ISO 4217 (`{"montant": "15000", "devise": "XOF"}`), jamais de flottant.
    - Listes paginées par curseur (`limite` ≤ 200, `curseur` opaque, `curseur_suivant` null à la fin).
    - Limite : 120 requêtes par minute et par boutique (429 + `Retry-After`).
    - La clé de la boutique suffit à dire de quelle boutique il s'agit : aucune route ne prend un identifiant de
      boutique.

    Les événements que Bob envoie à Naomy sont décrits dans la section `webhooks`.
servers:
  - url: https://agenc-ai.com/bob/api/v1/naomy
    description: Production
  - url: http://localhost:8799/api/v1/naomy
    description: Faux Bob ou Bob local (tests)

x-commandes-bob:
  description: |
    Messages du commerçant envoyés à Bob sans question (comparaison sans accents ni majuscules, message entier ou
    premier mot suivi d'un espace). Les boutons préfixés `bob:` vont toujours à Bob.
  mots:
    - vendu
    - annuler
    - ventes
    - mes ventes
    - ventes a confirmer
    - stock
    - mon stock
    - commandes
    - mes commandes
    - clients
    - qui attend
    - ajouter
    - nouveau produit
    - pause
    - reprendre
    - aide bob

x-prospection:
  empreintes: |
    SHA-256 en hexadécimal minuscule (64 caractères) de la valeur normalisée :
    - e-mail : en minuscules, sans espaces autour (« Awa@Exemple.ci  » → sha256("awa@exemple.ci")) ;
    - téléphone : chiffres seuls avec l'indicatif du pays, sans « + » ni « 00 » (« +225 07 01 02 03 04 » →
      sha256("2250701020304")). Un numéro local doit d'abord recevoir l'indicatif du pays de la boutique.
    Une personne peut avoir deux empreintes (e-mail et téléphone) : les envoyer toutes les deux.
  usage: |
    - Dès qu'une opposition arrive chez Naomy (STOP, désinscription, adresse invalide, plainte) : la déclarer à Bob
      (POST /prospection/oppositions), avec l'e-mail ET le téléphone quand Naomy les connaît.
    - Relire les oppositions au moins une fois par jour (GET /prospection/oppositions, depuis le dernier curseur), et
      les vérifier juste avant chaque envoi.
    - Avant chaque campagne ou vague : POST /prospection/verifier avec toute la cible (par paquets de 1 000), puis
      retirer les empreintes à exclure.
    - Motifs d'exclusion renvoyés par Bob : `opposition` ; `client_bob` (commerçant déjà client de Bob : jamais de
      prospection) ; `prospect_bob` (suivi par Bob : tout prospect « en cours », prévu, en séquence ou à relancer) ;
      `pas_interesse` (a dit non à Bob depuis moins de 180 jours).
    - Naomy exclut elle-même ses propres clients.

x-console:
  urls:
    bob: "https://agenc-ai.com/bob/superadmin/ (arrivée : ?jeton=<jeton>)"
    naomy: "https://agenc-ai.com/naomy/superadmin/ (arrivée : ?jeton=<jeton>) — à confirmer par Naomy ; Bob a le réglage NAOMY_CONSOLE_URL"
  jeton:
    description: |
      Format : `<charge>.<signature>`.
      - charge = JSON compact encodé en base64url SANS « = » :
        {"v": 1, "iss": "bob"|"naomy", "aud": "naomy"|"bob", "jti": "<32 hex>", "iat": <secondes>, "exp": <iat + 60>,
         "membre": MembreConsole}
      - signature = base64url SANS « = » de HMAC-SHA256(NAOMY_PLATFORM_SECRET, "console." + charge).
      Vérifications à l'arrivée : signature (comparaison à temps constant), `v` = 1, `aud` = la console qui reçoit,
      `iss` = l'autre console, `exp - iat` <= 60, maintenant dans [iat - 30 s ; exp + 30 s], `jti` jamais vu (le
      garder au moins 2 minutes). Refus : page de connexion avec « Ce passage a expiré ou n'est pas valable ».
      Le jeton passe dans l'adresse : la console qui le reçoit le retire aussitôt de l'adresse (history.replaceState),
      ne le journalise jamais et ouvre une session de 8 heures au plus.
    bob_vers_naomy: |
      Le membre clique « Naomy » dans l'interrupteur de Bob ; Bob signe un jeton (iss bob, aud naomy) avec les rôles
      de Bob et ouvre {console Naomy}?jeton=… . Naomy vérifie, met à jour sa copie du membre avec `membre` (nom,
      e-mail, rôles, actif) et ouvre la session ; `actif` false ou membre désactivé dans sa copie → refus.
    naomy_vers_bob: |
      Le membre clique « Bob » dans l'interrupteur de Naomy ; Naomy signe un jeton (iss naomy, aud bob) avec ce qu'elle
      sait du membre et ouvre https://agenc-ai.com/bob/superadmin/?jeton=… . Bob fait foi : il retrouve le membre par
      son e-mail, refuse s'il est désactivé ou n'a pas encore rejoint l'équipe, et applique les rôles de Bob (jamais
      ceux du jeton).
    connexion_directe_chez_naomy: |
      Sans passer par Bob, Naomy garde sa connexion (mot de passe + code e-mail) pour les membres de sa copie. Le mot de
      passe n'est jamais transmis entre les consoles ; un membre qui n'a jamais de mot de passe chez Naomy passe par Bob.
  roles:
    OWNER: "Propriétaire — tout. Chez Naomy, la rubrique Équipe renvoie vers la page « Équipe AgenC'AI » de Bob."
    SALES: "Commercial — prospects, relances, pré-inscriptions, ratios ; noms, secteurs, statuts des clients ; JAMAIS leurs chiffres (ventes, CA, audiences, résultats des posts)."
    MARKETING: "Marketing — campagnes, liens suivis, ratios de prospection ; pas les fiches clients."
    TECH: "Technique — monitoring, intégrations (WhatsApp, réseaux sociaux), coûts IA ; fiches clients sans chiffres."
    BILLING: "Facturation — formules, échéances, paiements, suspensions, coûts IA ; chiffres des clients."
    SUPPORT: "Support — fiches clients sans chiffres, suspendre / réactiver, aider ; pas les formules ni les prix."
    READONLY: "Lecture seule — voit presque tout sans rien changer ; pas les chiffres des clients."
  charte:
    description: |
      Même structure pour toutes les consoles (Bob, Naomy, puis les autres agents), couleurs et polices de chaque agent.
      - Menu latéral fixe (environ 250 px) : logo et nom de l'agent + « SUPER ADMIN » ; juste dessous, l'interrupteur
        des consoles (pastille de couleur + nom de chaque agent, celui en cours enfoncé) ; puis les rubriques avec une
        icône au trait. En bas : Clair / Sombre, puis la personne (initiales, nom, rôles) et la déconnexion.
      - Rubriques communes, dans cet ordre quand elles existent : Vue d'ensemble, Clients (Bob : Boutiques),
        Prospection, Pré-inscriptions, Coûts IA, Monitoring, Équipe AgenC'AI (Propriétaire ; chez Naomy : lien vers Bob).
        Une rubrique fermée au rôle n'apparaît pas.
      - Vue d'ensemble : « Bonjour <prénom> », 4 chiffres clés en cartes, « À faire aujourd'hui », activité récente,
        filtrés par rôle.
      - Mobile (moins de 900 px) : barre du haut avec le menu en tiroir ; aucun défilement horizontal.
      - Fenêtres de l'agent (jamais celles du navigateur) pour confirmer ; messages courts en bas de l'écran.
      - Couleurs : Bob vert #1B4332 (sombre #52B788), police Manrope ; Naomy or #C9A84C, polices Sora + DM Sans.
        Pastilles de l'interrupteur : Bob #40916C, Naomy #C9A84C (lisibles en clair et en sombre).

security:
  - cleBoutique: []

tags:
  - name: Prospection
  - name: Console
