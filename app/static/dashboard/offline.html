<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bob — pas de connexion</title>
<style>
  :root { --bg: #F4FAF6; --text: #14261C; --muted: #6C8277; --accent: #1B4332; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1A14; --text: #E6F2EA; --muted: #9DB3A7; --accent: #52B788; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg);
         color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 16px 0 8px; } p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="" width="72" height="72" style="border-radius: 16px;">
  <h1>Pas de connexion Internet</h1>
  <p>Bob a besoin d'Internet pour afficher vos conversations. Vérifiez votre connexion puis réessayez.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
