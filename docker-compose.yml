services:
  api:
    build: .
    restart: unless-stopped
    ports:
      # Joint uniquement par nginx sur le serveur (proxy_pass http://127.0.0.1:8002) :
      # jamais d'accès direct depuis Internet en HTTP simple, qui contournerait le HTTPS.
      - "127.0.0.1:8002:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/code/app

  worker:
    build: .
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/code/app

  beat:
    build: .
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/code/app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bob
      # Lu dans le .env (jamais commité). Le « :? » fait échouer le démarrage avec un message
      # clair si la variable manque, plutôt que de démarrer avec un mot de passe vide.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans le fichier .env}
      POSTGRES_DB: bob
    ports:
      # Accessible uniquement depuis le serveur lui-même, jamais depuis Internet
      # (Docker contourne ufw pour les ports publiés : l'adresse 127.0.0.1 est la vraie protection).
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bob"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Redis n'a pas de mot de passe : il ne doit JAMAIS être exposé sur Internet.
      - "127.0.0.1:6380:6379"

volumes:
  pgdata:
